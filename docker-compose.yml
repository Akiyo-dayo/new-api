services:
  nai-adapter:
    build: .
    image: nai-adapter:latest
    container_name: nai-adapter
    restart: always
    environment:
      # One image, <= 28 steps, <= 1024x1024: every request stays within 30 Anlas.
      MAX_N: "1"
      MAX_STEPS: "28"
      MAX_PIXELS: "1048576"
      MAX_VIBES: "4"
      MAX_CHAR_REFS: "1"
      MAX_IMAGE_BYTES: "10485760"
      MAX_ANLAS_PER_REQUEST: "30"
      NAI_OPUS: "true"
      VIBE_ENCODE_ANLAS: "2"
      VIBE_CACHE_DIR: "/data/vibe-cache"
      VIBE_CACHE_MAX: "500"
      MAX_QUEUE: "10"
      MAX_WAIT_SECONDS: "60"
      QUEUE_TIMEOUT_SECONDS: "75"
      NAI_TIMEOUT_SECONDS: "90"
      LOG_LEVEL: "INFO"
    volumes:
      - ./data:/data
    networks:
      - new-api-network
    # No ports: only new-api reaches this service, through the shared network.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  new-api-network:
    external: true
    name: new-api_new-api-network
