<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" fill="none">
  <!-- Lumen · a desk lamp lighting an open book. Original line illustration;
       mid-tone strokes so the same file reads on both paper and ink canvases. -->
  <defs>
    <radialGradient id="bulb" cx="372" cy="372" r="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE3A3" stop-opacity="0.8"/>
      <stop offset="0.35" stop-color="#F6C86E" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#F6C86E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cone" x1="380" y1="380" x2="640" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6C86E" stop-opacity="0.26"/>
      <stop offset="0.6" stop-color="#F6C86E" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#F6C86E" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="pool" cx="610" cy="960" r="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6C86E" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#F6C86E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="300" y1="250" x2="440" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F1D9A8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E2B35F" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="mote">
      <stop stop-color="#FFF1CC" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#F6C86E" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#F6C86E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- light: the cone and the pool on the page -->
  <path d="M332 356L414 334L880 980L300 1060Z" fill="url(#cone)"/>
  <ellipse cx="610" cy="965" rx="300" ry="120" fill="url(#pool)"/>
  <circle cx="372" cy="372" r="150" fill="url(#bulb)"/>

  <!-- the lamp: base, stem, arm, shade -->
  <g stroke="#7E8CA3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="200" cy="640" rx="78" ry="13"/>
    <path d="M200 640V392"/>
    <circle cx="200" cy="386" r="6" fill="#7E8CA3" fill-opacity="0.35"/>
    <path d="M205 382L326 296"/>
    <circle cx="330" cy="293" r="6" fill="#7E8CA3" fill-opacity="0.35"/>
    <path d="M334 296L352 318"/>
  </g>
  <g transform="rotate(34 372 330)">
    <path d="M322 282H422L452 372H292Z" fill="url(#shade)" stroke="#7E8CA3" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M300 372H444" stroke="#F6C86E" stroke-width="2.4" stroke-linecap="round" opacity="0.8"/>
  </g>
  <ellipse cx="372" cy="372" rx="26" ry="14" fill="url(#mote)"/>

  <!-- the desk -->
  <path d="M60 1078H860" stroke="#7E8CA3" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M120 1104H560" stroke="#7E8CA3" stroke-width="1.4" stroke-linecap="round" opacity="0.35"/>

  <!-- the open book -->
  <g stroke="#7E8CA3" stroke-width="2.2" stroke-linejoin="round">
    <path d="M396 902C470 882 540 886 606 912V1046C540 1020 470 1016 396 1036Z" fill="#F6C86E" fill-opacity="0.14"/>
    <path d="M606 912C672 886 742 882 816 902V1036C742 1016 672 1020 606 1046Z" fill="#F6C86E" fill-opacity="0.22"/>
    <path d="M606 912V1046"/>
    <path d="M386 1046C460 1030 540 1030 606 1056C672 1030 752 1030 826 1046" opacity="0.7"/>
  </g>
  <g stroke="#7E8CA3" stroke-width="1.6" stroke-linecap="round" opacity="0.55">
    <path d="M426 934C470 924 510 926 570 940"/>
    <path d="M426 958C470 948 510 950 570 964"/>
    <path d="M426 982C464 974 496 976 540 986"/>
    <path d="M642 940C700 926 742 924 786 934"/>
    <path d="M642 964C700 950 742 948 786 958"/>
    <path d="M642 988C686 978 716 976 748 982"/>
  </g>

  <!-- motes of light drifting up from the page -->
  <g fill="url(#mote)">
    <circle cx="520" cy="640" r="9" opacity="0.9"/>
    <circle cx="610" cy="540" r="6" opacity="0.6"/>
    <circle cx="676" cy="700" r="7.5" opacity="0.8"/>
    <circle cx="560" cy="800" r="5" opacity="0.55"/>
    <circle cx="740" cy="600" r="6" opacity="0.5"/>
    <circle cx="470" cy="760" r="6.5" opacity="0.65"/>
    <circle cx="690" cy="850" r="4.5" opacity="0.6"/>
    <circle cx="590" cy="440" r="4" opacity="0.4"/>
  </g>
</svg>
