<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440" fill="none">
  <!-- Lumen · wide study scene for the sign-in page. Transparent canvas: the
       page supplies the paper or ink wash behind it with CSS gradients. The
       lamp and book sit on the right so the form keeps the left half. -->
  <defs>
    <radialGradient id="bulb" cx="1700" cy="470" r="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE3A3" stop-opacity="0.7"/>
      <stop offset="0.3" stop-color="#F6C86E" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#F6C86E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cone" x1="1700" y1="480" x2="2000" y2="1250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6C86E" stop-opacity="0.3"/>
      <stop offset="0.6" stop-color="#F6C86E" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#F6C86E" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="pool" cx="2020" cy="1220" r="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6C86E" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#F6C86E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="1600" y1="300" x2="1800" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F1D9A8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E2B35F" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="mote">
      <stop stop-color="#FFF1CC" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#F6C86E" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#F6C86E" stop-opacity="0"/>
    </radialGradient>
  </defs>

