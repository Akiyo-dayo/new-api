<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="halo" x1="14" y1="20" x2="82" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DFF6FF"/>
      <stop offset="0.5" stop-color="#6ED6EE"/>
      <stop offset="1" stop-color="#3C7BD9"/>
    </linearGradient>
    <linearGradient id="bloom" x1="48" y1="22" x2="48" y2="74" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD6E7"/>
      <stop offset="1" stop-color="#F27BAE"/>
    </linearGradient>
    <linearGradient id="gold" x1="40" y1="40" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF3C4"/>
      <stop offset="1" stop-color="#E7B45A"/>
    </linearGradient>
  </defs>
  <!-- digital halo -->
  <circle cx="48" cy="48" r="42" stroke="url(#halo)" stroke-width="2" opacity="0.55"/>
  <circle cx="48" cy="48" r="34" stroke="url(#halo)" stroke-width="1" stroke-dasharray="1.5 4.5" opacity="0.75"/>
  <!-- wing strokes, left and right -->
  <path d="M30 42C22 36 16 34 9 36C16 38 20 42 24 48C19 47 14 48 10 51C16 51 21 54 26 58" stroke="url(#halo)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M66 42C74 36 80 34 87 36C80 38 76 42 72 48C77 47 82 48 86 51C80 51 75 54 70 58" stroke="url(#halo)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- starlance: four-point star, rose bloom with gold core -->
  <path d="M48 20C50 36 52 40 68 48C52 56 50 60 48 76C46 60 44 56 28 48C44 40 46 36 48 20Z" fill="url(#bloom)" opacity="0.96"/>
  <path d="M48 34C49 43 50 45 58 48C50 51 49 53 48 62C47 53 46 51 38 48C46 45 47 43 48 34Z" fill="url(#gold)"/>
  <!-- stray sparks -->
  <circle cx="72" cy="22" r="2.4" fill="#DFF6FF"/>
  <circle cx="79" cy="30" r="1.4" fill="#DFF6FF" opacity="0.8"/>
  <circle cx="20" cy="72" r="1.8" fill="#FFD6E7" opacity="0.85"/>
</svg>
