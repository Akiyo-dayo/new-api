<script id="chisa-r8">
(function () {

<script id="chisa-r13">
(function () {
  function colorize() {
    var els = document.querySelectorAll(
      '.node-card label, .node-card p, .node-card span, .summary-card label, .summary-card span'
    );
    els.forEach(function (el) {
      if (el.dataset.chisaArrows) return;
      if (el.children.length > 0) return;
      var t = el.textContent || '';
      if (t.indexOf('↑') === -1 && t.indexOf('↓') === -1) return;
      el.innerHTML = t
        .replace(/↑/g, '<span class="chisa-up" data-chisa-arrows="1">↑</span>')
        .replace(/↓/g, '<span class="chisa-down" data-chisa-arrows="1">↓</span>');
      el.dataset.chisaArrows = '1';
    });
  }
  colorize();
  var pending = false;
  new MutationObserver(function () {
    if (pending) return;
    pending = true;
    setTimeout(function () { pending = false; colorize(); }, 300);
  }).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>

<script id="chisa-r14">
(function () {
  // 统计条数值防折行：直接写内联样式，React 重渲染冲掉 class 也不受影响
  function fixSummary() {
    document.querySelectorAll('.summary-card label').forEach(function (el) {
      var t = (el.textContent || '').trim();
      // 数值 label 特征：含数字且带单位/符号
      if (!/[0-9]/.test(t)) return;
      if (el.style.whiteSpace === 'nowrap') return;
      el.style.whiteSpace = 'nowrap';
      // 超长则微缩字号
      requestAnimationFrame(function () {
        if (el.scrollWidth > el.clientWidth + 4) el.style.fontSize = '0.92rem';
      });
    });
    // TopCard 容器解除宽度硬限制
    document.querySelectorAll('.summary-card [class*="min-w-52"]').forEach(function (el) {
      el.style.minWidth = '0';
      el.style.maxWidth = 'none';
    });
  }
  fixSummary();
  var pending = false;
  new MutationObserver(function () {
    if (pending) return;
    pending = true;
    setTimeout(function () { pending = false; fixSummary(); }, 400);
  }).observe(document.querySelector('.summary-card') || document.documentElement, { childList: true, subtree: true });
})();
</script>

<script id="chisa-r15">
(function () {
  var ICON_SRC = 'https://newapi.akiyo.fun/chisa/chisa-icon.webp';

  /* ---------- ① Hero 头部（/about 同款：标题 + LIVE 时钟） ---------- */
  function pad(n) { return String(n).padStart(2, '0'); }
  function tick() {
    var now = new Date();
    var t = document.getElementById('chisa-hero-time');
    var d = document.getElementById('chisa-hero-date');
    if (t) t.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
    if (d) d.textContent = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
  }
  setInterval(tick, 1000);

  function ensureHero() {
    var summary = document.querySelector('.summary-card');
    var existing = document.getElementById('chisa-hero');
    if (!summary) {
      if (existing) existing.remove();
      return;
    }
    if (existing) return;
    var main = document.querySelector('.main-content') || summary.parentElement.parentElement;
    var hero = document.createElement('div');
    hero.id = 'chisa-hero';
    hero.className = 'chisa-hero';
    hero.innerHTML =
      '<div>' +
        '<div class="chisa-hero-eyebrow"><img src="' + ICON_SRC + '" alt=""/><span>SERVER STATUS</span></div>' +
        '<h1>服务器状态</h1>' +
        '<p>星炬学院全球节点实时运行状态</p>' +
      '</div>' +
      '<div class="chisa-hero-clock">' +
        '<div class="chisa-hero-live"><i></i>LIVE</div>' +
        '<div class="chisa-hero-time" id="chisa-hero-time">--:--:--</div>' +
        '<div class="chisa-hero-date" id="chisa-hero-date"></div>' +
      '</div>';
    var nav = main.querySelector('.nav-bar');
    if (nav && nav.nextSibling) main.insertBefore(hero, nav.nextSibling);
    else main.insertBefore(hero, main.firstChild);
    tick();
  }

  /* ---------- ①b 统计带只留四格：隐藏「当前时间」（时间在 Hero 时钟里） ---------- */
  function hideTimeCard() {
    document.querySelectorAll('.summary-card .chisa-stat-label').forEach(function (l) {
      var t = (l.textContent || '').trim();
      if (t !== '当前时间' && t !== 'Current Time') return;
      var card = l.closest('[class*="min-w-52"]') || l.parentElement;
      if (card && card.style.display !== 'none') card.style.display = 'none';
    });
  }

  /* ---------- ② 卡片统计行图标 ---------- */
  function svg(inner) {
    return '<span class="chisa-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg></span>';
  }
  var MEM = '<path d="M6 19v-3M10 19v-3M14 19v-3M18 19v-3M8 11V9M12 11V9M16 11V9M2 15h20"/><path d="M2 9a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2Z"/>';
  var DSK = '<line x1="22" x2="2" y1="12" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" x2="6.01" y1="16" y2="16"/><line x1="10" x2="10.01" y1="16" y2="16"/>';
  var ICONS = {
    'CPU': svg('<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2M15 20v2M9 2v2M9 20v2M2 15h2M2 9h2M20 15h2M20 9h2"/>'),
    '内存': svg(MEM), 'RAM': svg(MEM),
    '磁盘': svg(DSK), 'Disk': svg(DSK),
    '总流量': svg('<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/>'),
    '网络': svg('<rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3M12 12V8"/>'),
    '运行时间': svg('<line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/>')
  };

  function addIcons() {
    document.querySelectorAll('.node-card span, .node-card p, .node-card label').forEach(function (el) {
      if (el.dataset.chisaIcon) return;
      if (el.children.length > 0) return;
      var t = (el.textContent || '').trim();
      var icon = ICONS[t];
      if (!icon) return;
      el.innerHTML = icon + t;
      el.dataset.chisaIcon = '1';
    });
  }

  /* ---------- ③ 标签徽章内联强制显隐 ---------- */
  function fixTags() {
    document.querySelectorAll('.node-card').forEach(function (card) {
      var outer = card.querySelector(':scope > .rt-Flex');
      if (!outer) return;
      card.querySelectorAll('a [class*="Badge"]').forEach(function (b) {
        var flex = b.closest('.rt-Flex');
        if (!flex) return;
        /* 底部标签条（卡片外列的直接子级）不隐藏，只隐藏标题行内的 */
        var outerFlex = card.querySelector(':scope > .rt-Flex');
        if (outerFlex && flex.parentElement === outerFlex) return;
        if (flex.style.display !== 'none') flex.style.display = 'none';
      });
      Array.prototype.forEach.call(outer.children, function (child) {
        if (!child.classList || !child.classList.contains('rt-Flex')) return;
        if (!child.querySelector('[class*="Badge"]')) return;
        if (child.closest('a')) return;
        if (child.hidden) child.removeAttribute('hidden');
        if (child.style.display !== 'flex') {
          child.style.display = 'flex';
          child.style.flexWrap = 'wrap';
          child.style.gap = '0.3rem';
          child.style.marginTop = '0.4rem';
          child.style.paddingTop = '0.6rem';
          child.style.borderTop = '1px dashed color-mix(in oklch, var(--primary) 16%, transparent)';
        }
      });
    });
  }

  function run() { ensureHero(); hideTimeCard(); addIcons(); fixTags(); }
  run();
  var pending = false;
  new MutationObserver(function () {
    if (pending) return;
    pending = true;
    setTimeout(function () { pending = false; run(); }, 350);
  }).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
